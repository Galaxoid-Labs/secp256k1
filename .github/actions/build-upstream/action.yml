name: Build upstream libsecp256k1
description: >
  Clones and builds bitcoin-core/secp256k1 at a pinned tag, with every module enabled. It
  supplies three things at once: the .a the differential oracle links, the Wycheproof JSON,
  and the BIP327 vector header.

inputs:
  tag:
    description: Upstream tag, e.g. v0.7.1
    required: true

runs:
  using: composite
  steps:
    - name: Clone and build
      shell: bash
      run: |
        set -euo pipefail

        git clone --depth 1 --branch "${{ inputs.tag }}" \
          https://github.com/bitcoin-core/secp256k1 upstream

        # RECOVERY is off in the default build. Leaving it off links fine and then fails
        # with three missing symbols, which is exactly how it was found the first time.
        cmake -S upstream -B upstream/build \
          -DCMAKE_BUILD_TYPE=Release \
          -DSECP256K1_ENABLE_MODULE_RECOVERY=ON \
          -DSECP256K1_ENABLE_MODULE_ECDH=ON \
          -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON \
          -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON \
          -DSECP256K1_ENABLE_MODULE_ELLSWIFT=ON \
          -DSECP256K1_ENABLE_MODULE_MUSIG=ON \
          -DSECP256K1_BUILD_TESTS=OFF \
          -DSECP256K1_BUILD_BENCHMARK=OFF \
          -DSECP256K1_BUILD_CTIME_TESTS=OFF \
          -DBUILD_SHARED_LIBS=OFF

        cmake --build upstream/build -j"$(getconf _NPROCESSORS_ONLN)"

        # Fail here, with a clear message, rather than at an obscure link error later.
        for sym in secp256k1_ecdsa_recover secp256k1_schnorrsig_sign32 \
                   secp256k1_musig_pubkey_agg secp256k1_ellswift_decode secp256k1_ecdh; do
          nm -g upstream/build/lib/libsecp256k1.a 2>/dev/null | grep -q "T _\?$sym$" \
            || { echo "::error::upstream built without $sym; check the module flags"; exit 1; }
        done
        echo "upstream ${{ inputs.tag }} built with all modules"
